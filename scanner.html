
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPS-GRID | QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #0b1220;
      color: #f1f5f9;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      padding: 20px;
      background: #111c2e;
      border: 1px solid #243449;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 8px;
    }

    h3 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      padding: 12px;
      min-height: 50px;
      background: #0b1220;
      border: 1px solid #243449;
      border-radius: 10px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #0284c7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hint {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.8;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }
  </style>
</head>

<body>
  <main class="card">
    <h2>OPS-GRID</h2>
    <h3>ماسح QR لتسجيل الحضور</h3>

    <p class="hint">
      وجّه الكاميرا نحو رمز QR وتأكد من وضوح الرمز والإضاءة.
    </p>

    <div id="reader"></div>

    <p id="status">اضغط على الزر لتشغيل الكاميرا.</p>

    <button id="startBtn" type="button">
      تشغيل الكاميرا
    </button>

    <button id="closeBtn" type="button" hidden>
      إغلاق الماسح
    </button>
  </main>

  <script>
    const SCANNER_ORIGIN = window.location.origin;

    const statusBox = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const closeBtn = document.getElementById("closeBtn");

    let scanner = null;
    let started = false;
    let processing = false;
    let scanSent = false;

    function setStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = type || "";
    }

    function extractToken(text) {
      const value = String(text || "").trim();

      if (!value) return "";

      try {
        const url = new URL(value);
        const token = url.searchParams.get("token");

        if (token) {
          return token.trim();
        }

        // يسمح برابط مباشر للموظف يحتوي على الرمز
        return "";
      } catch (error) {
        // يقبل Token مباشرًا فقط إذا كان بصيغة متوقعة
        if (/^[a-zA-Z0-9_-]{16,128}$/.test(value)) {
          return value;
        }

        return "";
      }
    }

    async function handleScan(decodedText) {
      if (processing || scanSent) return;

      processing = true;

      setStatus(
        "تمت قراءة QR بنجاح.\nجارٍ فحص محتوى الرمز...",
        ""
      );

      const token = extractToken(decodedText);

      if (!token) {
        setStatus(
          "تمت قراءة QR، لكن لم يتم العثور على Token صالح.\nتأكد أنك تستخدم QR الخاص بالموظف.",
          "error"
        );

        processing = false;
        return;
      }

      if (!window.opener || window.opener.closed) {
        setStatus(
          "تمت قراءة الرمز، لكن صفحة الحضور الأصلية غير مفتوحة.\nافتح الماسح من زر OPS-GRID.",
          "error"
        );

        processing = false;
        return;
      }

      try {
        setStatus(
          "تم التحقق من محتوى الرمز.\nجارٍ إرسال Token إلى صفحة الحضور...",
          ""
        );

        /*
         * نستخدم "*" لتجاوز مشكلة اختلاف نطاق صفحة Apps Script.
         * صفحة Index.html تتحقق من event.origin قبل قبول الرسالة.
         */
        window.opener.postMessage(
          {
            type: "EMPLOYEE_QR_SCANNED",
            token: token
          },
          "*"
        );

        scanSent = true;

        try {
          if (scanner && started) {
            await scanner.stop();
            started = false;
          }
        } catch (error) {
          console.warn("Scanner stop error:", error);
        }

        setStatus(
          "تم إرسال الرمز إلى صفحة الحضور.\nارجع إلى OPS-GRID وانتظر التحقق من الموظف.",
          "success"
        );

        startBtn.hidden = true;
        closeBtn.hidden = false;

      } catch (error) {
        processing = false;

        setStatus(
          "تعذر إرسال الرمز إلى صفحة الحضور: " +
          (error.message || String(error)),
          "error"
        );
      }
    }

    async function startCamera() {
      if (started) return;

      if (typeof Html5Qrcode === "undefined") {
        setStatus(
          "تعذر تحميل مكتبة QR.\nتأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.",
          "error"
        );
        return;
      }

      startBtn.disabled = true;
      setStatus("جارٍ تشغيل الكاميرا...", "");

      try {
        scanner = new Html5Qrcode("reader", {
          verbose: false,
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
          ],
          useBarCodeDetectorIfSupported: false
        });

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 12,
            aspectRatio: 1
          },
          handleScan,
          function() {
            // تجاهل الإطارات التي لا تحتوي على QR
          }
        );

        started = true;
        processing = false;
        scanSent = false;

        setStatus(
          "الكاميرا تعمل والماسح يبحث عن QR.\nوجّه الكاميرا نحو الرمز.",
          "success"
        );

        startBtn.textContent = "الكاميرا تعمل";
        closeBtn.hidden = false;

      } catch (error) {
        scanner = null;
        started = false;
        startBtn.disabled = false;

        setStatus(
          "تعذر تشغيل الكاميرا:\n" +
          (error.message || String(error)),
          "error"
        );
      }
    }

    async function closeScanner() {
      try {
        if (scanner && started) {
          await scanner.stop();
          started = false;
        }
      } catch (error) {
        console.warn("Scanner close error:", error);
      }

      if (scanner) {
        try {
          scanner.clear();
        } catch (error) {
          console.warn("Scanner clear error:", error);
        }
      }

      if (window.opener && !window.opener.closed) {
        window.close();
      } else {
        setStatus(
          "تم إيقاف الماسح. يمكنك إغلاق الصفحة.",
          ""
        );
      }
    }

    startBtn.addEventListener("click", startCamera);
    closeBtn.addEventListener("click", closeScanner);
  </script>
</body>
</html>
