
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPS-GRID | QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      background: #0b1220;
      color: #f1f5f9;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 480px;
      margin: 20px auto;
      padding: 24px;
      background: #111c2e;
      border: 1px solid #243449;
      border-radius: 18px;
    }

    h2 { color: #38bdf8; }

    #reader {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      white-space: pre-line;
      line-height: 1.8;
      color: #cbd5e1;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #0284c7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .hint {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <main class="card">
    <h2>OPS-GRID</h2>
    <h3>ماسح QR لتسجيل الحضور</h3>

    <p class="hint">
      اضغط تشغيل الكاميرا ووجّهها إلى QR الموظف.
    </p>

    <div id="reader"></div>
    <p id="status">اضغط على الزر لتشغيل الكاميرا.</p>

    <button id="startBtn" type="button">تشغيل الكاميرا</button>
  </main>

  <script>
    const statusBox = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");

    let scanner = null;
    let busy = false;

    function extractToken(text) {
      const value = String(text || "").trim();

      try {
        const url = new URL(value);
        return url.searchParams.get("token") || "";
      } catch (_) {
        // السماح برمز مباشر فقط، وليس نصًا عشوائيًا.
        return /^[a-zA-Z0-9_-]{16,128}$/.test(value)
          ? value
          : "";
      }
    }

    startBtn.addEventListener("click", async () => {
      if (scanner || busy) return;

      busy = true;
      startBtn.disabled = true;
      statusBox.textContent = "جارٍ تشغيل الكاميرا...";

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 240, height: 240 },
            aspectRatio: 1
          },
          async (decodedText) => {
            if (busy) return;

            const token = extractToken(decodedText);

            if (!token) {
              statusBox.textContent =
                "الرمز لا يحتوي على Token صالح.";
              return;
            }

            if (!window.opener || window.opener.closed) {
              statusBox.textContent =
                "افتح الماسح من زر صفحة الحضور الأصلية.";
              return;
            }

            busy = true;
            statusBox.textContent =
              "تمت قراءة الرمز، جارٍ إرساله لصفحة الحضور...";

            try {
              await scanner.stop();
            } catch (_) {}

            // صفحة الحضور ستتحقق من مصدر الرسالة قبل قبولها.
            window.opener.postMessage(
              {
                type: "EMPLOYEE_QR_SCANNED",
                token: token
              },
              "*"
            );

            window.close();
          }
        );

        busy = false;
        statusBox.textContent =
          "الكاميرا تعمل. وجّهها إلى QR الموظف.";

      } catch (error) {
        scanner = null;
        busy = false;
        startBtn.disabled = false;

        statusBox.textContent =
          "تعذر تشغيل الكاميرا: " +
          (error.message || String(error));
      }
    });
  </script>
</body>
</html>
