
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">

  <title>OPS-GRID | QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      background: #0b1220;
      color: #f1f5f9;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 520px;
      margin: 12px auto;
      padding: 20px;
      background: #111c2e;
      border: 1px solid #243449;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .25);
    }

    h2 {
      margin: 0 0 8px;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .hint {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.9;
    }

    #reader {
      width: 100%;
      margin: 18px auto;
      overflow: hidden;
      border-radius: 12px;
      background: #050b14;
    }

    #reader video {
      object-fit: cover;
    }

    #status {
      min-height: 54px;
      padding: 12px;
      background: #0b1220;
      border: 1px solid #243449;
      border-radius: 10px;
      line-height: 1.8;
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #0284c7;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #26364c;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 18px;
      color: #64748b;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h2>OPS-GRID</h2>
    <h3>ماسح QR لتسجيل الحضور</h3>

    <p class="hint">
      وجّه الكاميرا نحو رمز QR.
      للحصول على أفضل قراءة، اجعل الرمز واضحًا وداخل إطار الكاميرا.
    </p>

    <div id="reader"></div>

    <p id="status">اضغط على تشغيل الكاميرا للبدء.</p>

    <button id="startBtn" type="button">
      تشغيل الكاميرا
    </button>

    <button id="testSoundBtn" class="secondary" type="button">
      اختبار الصوت
    </button>

    <button id="closeBtn" class="secondary" type="button" hidden>
      إيقاف الماسح
    </button>

    <div class="footer">OPS-GRID | QR Attendance</div>
  </main>

  <script>
    const statusBox = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const testSoundBtn = document.getElementById("testSoundBtn");
    const closeBtn = document.getElementById("closeBtn");

    let scanner = null;
    let started = false;
    let processing = false;
    let scanSent = false;
    let audioContext = null;

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = type;
    }

    // تفعيل الصوت بعد تفاعل المستخدم مع الصفحة
    async function enableScannerAudio() {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        throw new Error("المتصفح لا يدعم تشغيل الصوت.");
      }

      if (!audioContext || audioContext.state === "closed") {
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      if (audioContext.state !== "running") {
        throw new Error("الصوت غير مفعّل في المتصفح.");
      }
    }

    // صوت قصير عند قراءة QR
    async function playQRBeep() {
      try {
        await enableScannerAudio();

        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "square";
        oscillator.frequency.setValueAtTime(1400, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
        gain.gain.setValueAtTime(0.25, now + 0.10);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.onended = () => {
          oscillator.disconnect();
          gain.disconnect();
        };

        oscillator.start(now);
        oscillator.stop(now + 0.23);
      } catch (error) {
        console.error("Audio error:", error);
      }
    }

    // استخراج Token سواء كان QR يحتوي على رابط أو Token مباشر
    function extractToken(decodedText) {
      const value = String(decodedText || "").trim();

      if (!value) return "";

      try {
        const url = new URL(value);
        const token = url.searchParams.get("token");

        if (token) {
          return token.trim();
        }
      } catch (error) {
        // قد يكون المحتوى Token مباشرًا وليس رابطًا
      }

      if (/^[a-zA-Z0-9_-]{16,128}$/.test(value)) {
        return value;
      }

      return "";
    }

    // استقبال نتيجة المسح
    async function handleScan(decodedText) {
      if (processing || scanSent) return;

      processing = true;

      // الصوت يصدر فور اكتشاف الرمز
      await playQRBeep();

      const token = extractToken(decodedText);

      if (!token) {
        setStatus(
          "تم اكتشاف QR، لكن محتواه لا يحتوي على Token صالح.\nتأكد أنك تمسح رمز الموظف الصحيح.",
          "error"
        );

        processing = false;
        return;
      }

      if (!window.opener || window.opener.closed) {
        setStatus(
          "تمت قراءة الرمز، لكن صفحة OPS-GRID الأصلية غير متصلة.\nافتح الماسح من داخل صفحة الحضور نفسها.",
          "error"
        );

        processing = false;
        return;
      }

      try {
        setStatus("تمت قراءة الرمز، جارٍ إرساله إلى OPS-GRID...", "");

        window.opener.postMessage(
          {
            type: "EMPLOYEE_QR_SCANNED",
            token: token
          },
          "*"
        );

        scanSent = true;

        try {
          if (scanner && started) {
            await scanner.stop();
            started = false;
          }
        } catch (stopError) {
          console.warn("Scanner stop error:", stopError);
        }

        setStatus(
          "تم إرسال الرمز بنجاح.\nارجع إلى صفحة OPS-GRID للتحقق من بيانات الموظف.",
          "success"
        );

        startBtn.hidden = true;
        closeBtn.hidden = false;
      } catch (error) {
        processing = false;

        setStatus(
          "تعذر إرسال الرمز:\n" + (error.message || String(error)),
          "error"
        );
      }
    }

    // تشغيل الكاميرا بإعدادات قراءة سريعة ومساحة مسح كبيرة
    async function startCamera() {
      if (started) return;

      if (typeof Html5Qrcode === "undefined") {
        setStatus(
          "تعذر تحميل مكتبة QR.\nتحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.",
          "error"
        );
        return;
      }

      startBtn.disabled = true;
      setStatus("جارٍ تفعيل الصوت وتشغيل الكاميرا...", "");

      try {
        await enableScannerAudio();

        scanner = new Html5Qrcode("reader", {
          verbose: false,
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
          ],
          useBarCodeDetectorIfSupported: false
        });

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 25,

            qrbox: function(viewfinderWidth, viewfinderHeight) {
              const size = Math.floor(
                Math.min(viewfinderWidth, viewfinderHeight) * 0.85
              );

              return {
                width: size,
                height: size
              };
            },

            aspectRatio: 1,
            disableFlip: false
          },
          handleScan,
          function() {
            // تجاهل الإطارات التي لا تحتوي على QR قابل للقراءة
          }
        );

        started = true;
        processing = false;
        scanSent = false;

        setStatus(
          "الكاميرا تعمل والماسح يبحث عن QR.\nضع الرمز داخل الإطار وثبّت الهاتف لحظة.",
          "success"
        );

        startBtn.textContent = "الكاميرا تعمل";
        closeBtn.hidden = false;
      } catch (error) {
        scanner = null;
        started = false;
        startBtn.disabled = false;

        setStatus(
          "تعذر تشغيل الكاميرا:\n" + (error.message || String(error)),
          "error"
        );
      }
    }

    async function testSound() {
      try {
        await enableScannerAudio();
        await playQRBeep();

        setStatus(
          "تم تنفيذ اختبار الصوت.\nإذا لم تسمع صوتًا، ارفع صوت الوسائط وتأكد من عدم كتم المتصفح.",
          "success"
        );
      } catch (error) {
        setStatus(
          "تعذر تفعيل الصوت:\n" + (error.message || String(error)),
          "error"
        );
      }
    }

    async function stopCamera() {
      try {
        if (scanner && started) {
          await scanner.stop();
          started = false;
        }
      } catch (error) {
        console.warn("Scanner stop error:", error);
      }

      if (scanner) {
        try {
          scanner.clear();
        } catch (error) {
          console.warn("Scanner clear error:", error);
        }
      }

      if (audioContext && audioContext.state !== "closed") {
        try {
          await audioContext.close();
        } catch (error) {
          console.warn("Audio close error:", error);
        }
      }

      if (window.opener && !window.opener.closed) {
        window.close();
      } else {
        setStatus("تم إيقاف الماسح. يمكنك إغلاق الصفحة.", "");
        closeBtn.hidden = true;
      }
    }

    startBtn.addEventListener("click", startCamera);
    testSoundBtn.addEventListener("click", testSound);
    closeBtn.addEventListener("click", stopCamera);
  </script>
</body>
</html>
