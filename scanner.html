
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPS-GRID | QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #0b1220;
      color: #f1f5f9;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      padding: 20px;
      background: #111c2e;
      border: 1px solid #243449;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 8px;
    }

    h3 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      padding: 12px;
      min-height: 50px;
      background: #0b1220;
      border: 1px solid #243449;
      border-radius: 10px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #0284c7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hint {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.8;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }
  </style>
</head>

<body>
  <main class="card">
    <h2>OPS-GRID</h2>
    <h3>ماسح QR لتسجيل الحضور</h3>

    <p class="hint">
      وجّه الكاميرا نحو رمز QR وتأكد من وضوح الرمز والإضاءة.
    </p>

    <div id="reader"></div>

    <p id="status">اضغط على الزر لتشغيل الكاميرا.</p>

    <button id="startBtn" type="button">
      تشغيل الكاميرا
    </button>

    <button id="testSoundBtn" type="button">
      اختبار الصوت
    </button>

    <button id="closeBtn" type="button" hidden>
      إغلاق الماسح
    </button>
  </main>

  <script>
    const statusBox = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const testSoundBtn = document.getElementById("testSoundBtn");
    const closeBtn = document.getElementById("closeBtn");

    let scanner = null;
    let started = false;
    let processing = false;
    let scanSent = false;
    let audioContext = null;

    function setStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = type || "";
    }

    // تفعيل الصوت بعد تفاعل المستخدم مع الصفحة
    async function enableScannerAudio() {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        throw new Error("المتصفح لا يدعم تشغيل الصوت.");
      }

      if (!audioContext || audioContext.state === "closed") {
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      if (audioContext.state !== "running") {
        throw new Error("الصوت غير مفعّل في المتصفح.");
      }
    }

    // صوت إلكتروني قصير عند اكتشاف QR
    async function playQRBeep() {
      try {
        await enableScannerAudio();

        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "square";
        oscillator.frequency.setValueAtTime(1400, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
        gain.gain.setValueAtTime(0.25, now + 0.10);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.onended = function() {
          oscillator.disconnect();
          gain.disconnect();
        };

        oscillator.start(now);
        oscillator.stop(now + 0.23);

      } catch (error) {
        console.error("Audio error:", error);

        setStatus(
          "تعذر تشغيل الصوت. اضغط اختبار الصوت وتأكد من مستوى صوت الوسائط.",
          "error"
        );
      }
    }

    function extractToken(text) {
      const value = String(text || "").trim();

      if (!value) return "";

      try {
        const url = new URL(value);
        return (url.searchParams.get("token") || "").trim();
      } catch (error) {
        if (/^[a-zA-Z0-9_-]{16,128}$/.test(value)) {
          return value;
        }

        return "";
      }
    }

    async function handleScan(decodedText) {
      if (processing || scanSent) return;

      processing = true;

      // يصدر الصوت فور اكتشاف رمز QR
      await playQRBeep();

      setStatus(
        "تمت قراءة QR بنجاح.\nجارٍ فحص محتوى الرمز...",
        ""
      );

      const token = extractToken(decodedText);

      if (!token) {
        setStatus(
          "تمت قراءة QR، لكن لم يتم العثور على Token صالح.\nتأكد أنك تستخدم QR الخاص بالموظف.",
          "error"
        );

        processing = false;
        return;
      }

      if (!window.opener || window.opener.closed) {
        setStatus(
          "تمت قراءة الرمز، لكن صفحة الحضور الأصلية غير مفتوحة.\nافتح الماسح من زر OPS-GRID.",
          "error"
        );

        processing = false;
        return;
      }

      try {
        setStatus(
          "تمت قراءة الرمز.\nجارٍ إرسال Token إلى صفحة الحضور...",
          ""
        );

        window.opener.postMessage(
          {
            type: "EMPLOYEE_QR_SCANNED",
            token: token
          },
          "*"
        );

        scanSent = true;

        try {
          if (scanner && started) {
            await scanner.stop();
            started = false;
          }
        } catch (error) {
          console.warn("Scanner stop error:", error);
        }

        setStatus(
          "تم إرسال الرمز إلى صفحة الحضور.\nارجع إلى OPS-GRID وانتظر التحقق من الموظف.",
          "success"
        );

        startBtn.hidden = true;
        closeBtn.hidden = false;

      } catch (error) {
        processing = false;

        setStatus(
          "تعذر إرسال الرمز إلى صفحة الحضور:\n" +
          (error.message || String(error)),
          "error"
        );
      }
    }

    async function startCamera() {
      if (started) return;

      if (typeof Html5Qrcode === "undefined") {
        setStatus(
          "تعذر تحميل مكتبة QR.\nتأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.",
          "error"
        );
        return;
      }

      startBtn.disabled = true;
      setStatus("جارٍ تفعيل الصوت وتشغيل الكاميرا...", "");

      try {
        // يجب تنفيذ ذلك بعد ضغط المستخدم على الزر
        await enableScannerAudio();

        scanner = new Html5Qrcode("reader", {
          verbose: false,
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
          ],
          useBarCodeDetectorIfSupported: false
        });

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 12,
            aspectRatio: 1
          },
          handleScan,
          function() {
            // تجاهل الإطارات التي لا تحتوي على QR
          }
        );

        started = true;
        processing = false;
        scanSent = false;

        setStatus(
          "الكاميرا تعمل والماسح يبحث عن QR.\nيمكنك الضغط على اختبار الصوت للتأكد من عمله.",
          "success"
        );

        startBtn.textContent = "الكاميرا تعمل";
        closeBtn.hidden = false;

      } catch (error) {
        scanner = null;
        started = false;
        startBtn.disabled = false;

        setStatus(
          "تعذر تشغيل الكاميرا أو الصوت:\n" +
          (error.message || String(error)),
          "error"
        );
      }
    }

    async function testSound() {
      try {
        await enableScannerAudio();
        await playQRBeep();

        setStatus(
          "تم تنفيذ اختبار الصوت. إذا لم تسمع شيئًا، ارفع صوت الوسائط وأوقف الوضع الصامت.",
          "success"
        );
      } catch (error) {
        setStatus(
          "تعذر تفعيل الصوت: " +
          (error.message || String(error)),
          "error"
        );
      }
    }

    async function closeScanner() {
      try {
        if (scanner && started) {
          await scanner.stop();
          started = false;
        }
      } catch (error) {
        console.warn("Scanner close error:", error);
      }

      if (scanner) {
        try {
          scanner.clear();
        } catch (error) {
          console.warn("Scanner clear error:", error);
        }
      }

      if (audioContext && audioContext.state !== "closed") {
        try {
          await audioContext.close();
        } catch (error) {
          console.warn("Audio close error:", error);
        }
      }

      if (window.opener && !window.opener.closed) {
        window.close();
      } else {
        setStatus("تم إيقاف الماسح. يمكنك إغلاق الصفحة.", "");
      }
    }

    startBtn.addEventListener("click", startCamera);
    testSoundBtn.addEventListener("click", testSound);
    closeBtn.addEventListener("click", closeScanner);
  </script>
</body>
</html>
