
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPS-GRID | QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #0b1220;
      color: #f1f5f9;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 500px;
      margin: 15px auto;
      padding: 20px;
      background: #111c2e;
      border: 1px solid #243449;
      border-radius: 18px;
    }

    h2 { color: #38bdf8; }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #status {
      padding: 12px;
      background: #0b1220;
      border-radius: 10px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #0284c7;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .hint {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <main class="card">
    <h2>OPS-GRID</h2>
    <h3>ماسح QR لتسجيل الحضور</h3>

    <p class="hint">
      قرّب الرمز من الكاميرا، وثبّت الهاتف وتأكد من وضوح الإضاءة.
    </p>

    <div id="reader"></div>

    <p id="status">جارٍ تجهيز الماسح...</p>

    <button id="startBtn" type="button">
      تشغيل الكاميرا
    </button>
  </main>

  <script>
    const statusBox = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");

    let scanner = null;
    let started = false;
    let processing = false;

    function extractToken(text) {
      const value = String(text || "").trim();

      try {
        const url = new URL(value);
        const token = url.searchParams.get("token");

        if (token) return token.trim();

        // لو الرمز نفسه Token وليس رابطًا
        if (/^[a-zA-Z0-9_-]{16,128}$/.test(value)) {
          return value;
        }

        return "";
      } catch (_) {
        return /^[a-zA-Z0-9_-]{16,128}$/.test(value)
          ? value
          : "";
      }
    }

    async function handleScan(decodedText) {
      if (processing) return;

      processing = true;

      statusBox.textContent = "تمت قراءة QR بنجاح. جارٍ فحص محتواه...";

      const token = extractToken(decodedText);

      if (!token) {
        statusBox.textContent =
          "الكاميرا قرأت QR، لكن محتواه ليس Token صالحًا أو رابطًا يحتوي على ?token=.\n" +
          "راجع محتوى QR الذي تستخدمه.";
        processing = false;
        return;
      }

      if (!window.opener || window.opener.closed) {
        statusBox.textContent =
          "تمت قراءة الرمز، لكن صفحة الحضور الأصلية غير مفتوحة.\n" +
          "افتح الماسح من زر صفحة OPS-GRID.";
        processing = false;
        return;
      }

      statusBox.textContent =
        "تمت القراءة. جارٍ إرسال الرمز لصفحة الحضور...";

      try {
        if (scanner && started) {
          await scanner.stop();
          started = false;
        }
      } catch (error) {
        console.warn("Scanner stop:", error);
      }

      window.opener.postMessage(
        {
          type: "EMPLOYEE_QR_SCANNED",
          token: token
        },
        "https://script.google.com"
      );

      statusBox.textContent =
        "تم إرسال الرمز. ارجع إلى صفحة الحضور.";

      window.close();
    }

    startBtn.addEventListener("click", async () => {
      if (started) return;

      if (typeof Html5Qrcode === "undefined") {
        statusBox.textContent =
          "تعذر تحميل مكتبة قراءة QR. تأكد من الإنترنت وأعد تحميل الصفحة.";
        return;
      }

      startBtn.disabled = true;
      statusBox.textContent = "جارٍ تشغيل الكاميرا...";

      try {
        scanner = new Html5Qrcode("reader", {
          verbose: false,
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
          ],
          useBarCodeDetectorIfSupported: false
        });

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 12,
            aspectRatio: 1
            // بدون qrbox لتجربة القراءة على كامل الصورة
          },
          handleScan,
          function() {
            // عدم عرض خطأ مع كل إطار لا يحتوي على QR.
          }
        );

        started = true;
        statusBox.textContent =
          "الكاميرا تعمل والماسح يبحث عن QR.\n" +
          "لو لم يلتقط الرمز، قرّبه وجرّب تحسين الإضاءة.";

        startBtn.textContent = "الكاميرا تعمل";

      } catch (error) {
        scanner = null;
        started = false;
        startBtn.disabled = false;

        statusBox.textContent =
          "تعذر تشغيل الماسح: " +
          (error.message || String(error));
      }
    });
  </script>
</body>
</html>
